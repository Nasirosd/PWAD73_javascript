<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function  fac(num) {
    if (num < 0) return "Undefined";
    
    let result = 1;
    
    // Loop from the input number down to 1
    for (let i = num; i > 1; i--) {
        result *= i;
    }
    
    return result;
}

document.write(fac(num));
    </script>
</body>
</html>
